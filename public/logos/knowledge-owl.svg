<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" role="img" aria-label="Knowledge Owl">
  <!-- Body -->
  <ellipse cx="50" cy="62" rx="28" ry="30" fill="#2D6E9E"/>
  <!-- Head -->
  <circle cx="50" cy="36" r="22" fill="#2D6E9E"/>
  <!-- Ear tufts -->
  <polygon points="34,18 28,4 40,14" fill="#2D6E9E"/>
  <polygon points="66,18 72,4 60,14" fill="#2D6E9E"/>
  <!-- Face -->
  <ellipse cx="50" cy="38" rx="16" ry="14" fill="#F4A533"/>
  <!-- Eyes -->
  <circle cx="43" cy="34" r="6" fill="white"/>
  <circle cx="57" cy="34" r="6" fill="white"/>
  <circle cx="43" cy="34" r="3.5" fill="#1A3A52"/>
  <circle cx="57" cy="34" r="3.5" fill="#1A3A52"/>
  <!-- Beak -->
  <polygon points="50,40 46,46 54,46" fill="#D4821A"/>
  <!-- Wings -->
  <ellipse cx="24" cy="64" rx="12" ry="20" fill="#1E5278" transform="rotate(-15 24 64)"/>
  <ellipse cx="76" cy="64" rx="12" ry="20" fill="#1E5278" transform="rotate(15 76 64)"/>
  <!-- Feet -->
  <line x1="40" y1="90" x2="36" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="90" x2="40" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="40" y1="90" x2="44" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="56" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="60" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="60" y1="90" x2="64" y2="98" stroke="#D4821A" stroke-width="2.5" stroke-linecap="round"/>
</svg>
