<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" role="img" aria-label="Mailchimp">
  <!-- Yellow circle background -->
  <circle cx="100" cy="100" r="99" fill="#FFE01B"/>

  <!-- Left ear -->
  <ellipse cx="40" cy="118" rx="19" ry="23" fill="#1D1D1B"/>
  <ellipse cx="40" cy="118" rx="11" ry="14" fill="#FFE01B"/>

  <!-- Head (outer dark shape) -->
  <ellipse cx="108" cy="118" rx="66" ry="70" fill="#1D1D1B"/>

  <!-- Cap crown -->
  <ellipse cx="102" cy="55" rx="44" ry="30" fill="#1D1D1B"/>
  <!-- Cap brim -->
  <path d="M48 75 Q55 60 120 52 L122 65 Q65 72 58 84z" fill="#1D1D1B"/>

  <!-- Yellow face -->
  <ellipse cx="110" cy="122" rx="53" ry="56" fill="#FFE01B"/>

  <!-- Cheek shadow left -->
  <ellipse cx="85" cy="140" rx="20" ry="16" fill="#F5C800" opacity="0.6"/>
  <!-- Cheek shadow right -->
  <ellipse cx="132" cy="134" rx="16" ry="14" fill="#F5C800" opacity="0.6"/>

  <!-- Right eye (open) -->
  <ellipse cx="126" cy="104" rx="10" ry="11" fill="white"/>
  <circle cx="127" cy="106" r="6" fill="#1D1D1B"/>
  <circle cx="129" cy="103" r="2" fill="white"/>

  <!-- Left eye (winking — closed curved line) -->
  <path d="M88 102 Q97 94 106 102" fill="none" stroke="#1D1D1B" stroke-width="4" stroke-linecap="round"/>

  <!-- Nose dots -->
  <circle cx="107" cy="121" r="3.5" fill="#1D1D1B"/>
  <circle cx="119" cy="119" r="3.5" fill="#1D1D1B"/>

  <!-- Big grin — teeth fill -->
  <path d="M82 138 Q108 162 142 138 Q136 155 108 158 Q82 156 82 138z" fill="white"/>
  <!-- Grin outline -->
  <path d="M82 138 Q108 164 142 138" fill="none" stroke="#1D1D1B" stroke-width="3.5" stroke-linecap="round"/>
  <!-- Lip line -->
  <path d="M88 142 Q108 150 136 141" fill="none" stroke="#1D1D1B" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
</svg>
